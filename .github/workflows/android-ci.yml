name: Android CI

on:
  push:
    branches: [main, vidya-foundation]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Python tooling
        run: python -m py_compile tools/verify_dataset_archive.py tools/train_imagefolder_baseline.py
      - name: Test dataset archive verifier
        run: python -m unittest discover -s tools/tests -v
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vidya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
